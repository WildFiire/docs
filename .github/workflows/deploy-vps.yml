name: Deploy DOCS to VPS

on:
  push:
    branches:
      - main # Trigger deployment when pushing to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Debug Secrets Configuration
        run: |
          echo "VPS_HOST is: ${{ secrets.VPS_HOST != '' && 'SET' || 'EMPTY' }}"
          echo "VPS_USER is: ${{ secrets.VPS_USER != '' && 'SET' || 'EMPTY' }}"
          echo "VPS_SSH_KEY is: ${{ secrets.VPS_SSH_KEY != '' && 'SET' || 'EMPTY' }}"
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.VITE_GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}       # Your VPS IP or domain
          username: ${{ secrets.VPS_USER }}   # e.g., root or ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}     # Private SSH key for authentication
          envs: GH_TOKEN
          script: |
            # Navigate to the project directory
            cd /var/www/wiki
            
            # Pull the latest changes from the main branch
            git fetch --all
            git reset --hard origin/main

            # Install dependencies (force include devDependencies for the build)
            npm install --include=dev

            # Build the static VitePress files and API server
            VITE_GITHUB_TOKEN="$GH_TOKEN" npm run docs:build

            # Free port 3000 if an orphaned process is hanging
            fuser -k 3000/tcp 2>/dev/null || true

            # Delete any old PM2 registration to prevent stale script path / env cache
            pm2 delete wildfire-wiki-api 2>/dev/null || true

            # Reset auto-generated initial team cache so root credentials match Parola!123
            rm -f content/team.json 2>/dev/null || true

            # Start fresh API server directly via server.js
            pm2 start server.js --name wildfire-wiki-api --time
            pm2 save

            # Diagnostic checks in GitHub Actions logs
            sleep 3
            pm2 status
            echo "=== PM2 RECENT LOGS ==="
            pm2 logs wildfire-wiki-api --lines 30 --nostream || true
            echo "=== LOCAL API HEALTH CHECK (127.0.0.1:3000) ==="
            curl -s -i http://127.0.0.1:3000/api/admin/auth/me || true

            # Clean up any diagnostic artifacts
            rm -f docs/.vitepress/dist/deploy-diag.txt



